<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor LSC UPN</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Librerías de Inteligencia Artificial -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    
    <!-- Librerías de MediaPipe (Visión de cámara) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1 style="text-align: center; color: #333;">Traductor LSC UPN</h1>
    
    <div id="video-container">
        <!-- El video está oculto, solo mostramos el canvas con el esqueleto dibujado -->
        <video id="videoElement" style="display:none;"></video>
        <canvas id="canvasElement" width="640" height="480"></canvas>
        <h2 id="textoTraduccion">Cargando sistema de IA...</h2>
    </div>

    <!-- Panel de Control Nativo -->
    <div id="panel-controles">
        <h3>Añadir Nueva Seña</h3>
        <input type="text" id="input-sena" placeholder="Ej: UNIVERSIDAD">
        <button id="btn-grabar">Empezar a grabar</button>
        <div id="status-texto">Muestras de grabación: 0</div>
        
        <hr>
        
        <h3>Memoria Global (Nube)</h3>
        <button id="btn-subir">Subir a la nube</button>
        <button id="btn-descargar">Descargar de la nube</button>
        <div id="nube-status">Sin sincronizar</div>
    </div>

    <!-- MUY IMPORTANTE: type="module" es obligatorio para conectar con Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
