<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor LSC - Proyecto de Grado</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 1. Librerías de MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <!-- 2. Librería de TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
</head>
<body>
    <div class="contenedor">
        <h1>Traductor LSC UPN</h1>
        
        <div class="video-container" style="position: relative; width: 640px; height: 480px; margin: 0 auto;">
            <video id="videoElement" autoplay playsinline style="display: none;"></video>
            <canvas id="canvasElement" width="640" height="480" style="position: absolute; top: 0; left: 0;"></canvas>
        </div>

        <div class="traduccion-box" style="text-align: center; margin-top: 20px;">
            <h2 id="textoTraduccion">Cargando modelo de IA...</h2>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
